# yaml-language-server: $schema=https://developerz.ai/schemas/maintainer.v1.json
# developerz.ai maintainer policy: developerz-ai/open-mmorpg
#
# AI-maintained: the agent triages, answers, reviews and closes what has stalled, and merges on
# green for its own and the dependency bots' pull requests. Releases are the maintainers' own: nothing here publishes.
version: 1

tone:
  voice: friendly
  language: en

triage:
  ask_for_repro: true
  required_fields: [steps, expected, actual, version]
  qualify_into: [bug, feature, dupe, question, docs]
  close_unanswered_repro_after_days: 14
  stale_after_days: 30
  stale_action: comment_then_close
  non_goals:
    - "Client-authoritative state: the client sends intent, never state"
    - "Ownership writes through the cache or a bus: they go to YugabyteDB directly, in a transaction"
    - "Proprietary asset formats or tooling: open formats only"
    - "Any game asset, name or table extracted from another game: original IP only"
    - "Realm caps or login queues"
    - "A light theme or a theme toggle in the operator web"
    - "Outside human contributors' changes to CI, release or publish automation (.github/): members maintain that pipeline"
    - "Filings (including surveys) whose only fix is CI/release/publish automation under .github/ are not agent-actionable; hand to a human repository maintainer who owns the fix, not the fleet."
    - "Agent tasks from such filings must be scoped to a genuine fix outside .github/; otherwise retain human ownership."

handoff:
  mode: fleet
  ask_reporter_first: false

pr:
  wait_for_other_bots: [coderabbit]
  # Named so the agent knows which red check is the author's to fix. Re-check against the
  # repo's protection and `.github/workflows/` when either changes; this list is not the ruleset.
  required_checks:
    - "rust (fmt · clippy · test)"
    - "web (lint · typecheck · test · build)"
    - "rust (integration · live Postgres)"
  auto_merge: true
  # An outside contributor's pull request and a member's wait for a member.
  auto_merge_scope: own_and_dependency_bots
  require_review: true
  close_awaiting_author_after_days: 21

review:
  force: true # without this the native review defers to CodeRabbit where CodeRabbit is active

release:
  # `none`: there is no release manager. Empty channels: the agent publishes nothing itself.
  manager: none
  channels: []

escalate:
  # Empty: nothing beyond the platform's hardcoded asks (security, license, CLA).
  ask_before_acting: []

schedules:
  - name: improve
    days: [mon]
    weeks_of_month: [1]
    hours_utc: [8]
    brief_file: .dz/schedules/improve.md

# Added by the developerz.ai maintainer agent: blocks from the current template this file did not have. Each states the value already in effect; edit it like any other key.

# branches: on at 60 because this file exists. A branch with no new commit
# this long is tagged archive/<branch>/<date> at its last commit, then deleted.
# false keeps every branch. See /docs/maintainer-yml.
branches:
  close_inactive_after_days: 60

# scout: the survey is off here (idea / undeployed repo, census 2026-11-28: ~14M tokens per survey run).
# `broken_only` files only what is already broken; `full` also files ideas.
scout:
  survey: "off"  # quoted: YAML 1.1 parsers read a bare off as false

# devops: advisory watch off (idea / undeployed repo: nothing ships to users). `advisories` turns it on.
devops:
  watch: "off"  # quoted: YAML 1.1 parsers read a bare off as false

# care: docs_drift off (census 2026-11-28: 47 tasks, 8 docs-only merges, 33 failed). flaky_tests keeps its default.
care:
  docs_drift: "off"
