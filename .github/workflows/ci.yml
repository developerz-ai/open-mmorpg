name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Docs-only PRs (`docs/`, `*.md`) skip the three jobs below. A skipped job reports success, so the
  # required `rust` and `web` checks still resolve. Everything else, and every `main` push, runs.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          fetch-depth: 2
      - id: diff
        run: |
          code=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ] \
              && changed=$(git diff --name-only HEAD^1 HEAD) && [ -n "$changed" ] \
              && ! grep -qvE '^docs/|\.md$' <<<"$changed"; then
            code=false
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  rust:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: rust (fmt · clippy · test)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2.87.30
        with:
          tool: nextest
      - name: install bevy dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libx11-dev pkg-config g++
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: test
        run: cargo nextest run --locked --workspace --all-features

  rust-integration:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: rust (integration · live Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: omm
          POSTGRES_PASSWORD: omm
          POSTGRES_DB: omm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U omm"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Yugabyte speaks the Postgres wire → dev/CI run on plain Postgres.
      TEST_DATABASE_URL: postgres://omm:omm@localhost:5432/omm_test
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2.87.30
        with:
          tool: nextest
      # Only the DB-backed tests: the unit tests already ran in the `rust` job.
      - name: integration tests (ignored only, live DB)
        run: cargo nextest run --locked --workspace --all-features --run-ignored only

  web:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: web (lint · typecheck · test · build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: lint (biome)
        run: bun run lint
      - name: typecheck
        run: bun run typecheck
      - name: test
        run: bun test
      - name: build web
        run: bun run --filter @omm/web build
